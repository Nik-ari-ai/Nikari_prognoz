horizons:
- 1
- 3
- 6
- 12
backtest:
  min_train_months: 6
  origin_step: 1
  tournament_territories: 120
  random_seed: 42
prophet_params:
  weekly_seasonality: false
  daily_seasonality: false
  seasonality_mode: additive
  uncertainty_samples: 0
  yearly_fourier_order: 3
  n_changepoints: 5
  minimum_seasonal_history: 24
ets_params:
  trend: add
  seasonal: add
  seasonal_periods: 12
lightgbm_params:
  objective: regression_l1
  n_estimators: 200
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 40
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0
  n_jobs: 4
  verbose: -1
  random_state: 42
  deterministic: true
  force_col_wise: true
features:
  lags:
  - 1
  - 2
  - 3
  - 6
  - 12
  rolling_means:
  - 3
  - 6
  - 12
  use_month_dummies: true
  use_market_access: false
  use_region: false
  use_coordinates: false
  use_holiday_features: false
  use_news_features: false
target:
  use_log1p: true
output:
  metrics_dir: outputs/metrics
  forecasts_dir: outputs/forecasts
  figures_dir: outputs/figures
