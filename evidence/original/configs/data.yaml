# ===========================================================================
# Конфигурация загрузки и подготовки данных.
# Все пути указаны относительно корня репозитория.
# ===========================================================================

# ---- Исходные файлы (как они лежат в наборе СберИндекса) -------------------
paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  external_dir: "data/external"

  # Основной датасет: безналичные потребительские расходы по МО и категориям
  consumption_file: "data/raw/consumption.parquet"

  # Индекс доступности рынков (статический признак по каждому МО)
  market_access_file: "data/raw/market_access.parquet"

  # Граф транспортных связей между МО (расстояния highway/railway)
  connection_file: "data/raw/connection.parquet"

  # Справочник территорий: id -> регион, координаты центра, тип МО
  territory_dict_file: "data/raw/t_dict_municipal_districts.xlsx"

# ---- Имена колонок в consumption.parquet ----------------------------------
columns:
  date: "date"                 # строка вида "2023-01"
  territory_id: "territory_id" # целочисленный код МО
  category: "category"         # категория расходов (строка)
  value: "value"               # оценка средних расходов жителя МО, руб.

# ---- Категория-"итог" ------------------------------------------------------
# По описанию СберИндекса "Все категории" — это общий показатель расходов
# (он больше суммы пяти частных категорий, так как включает прочие траты).
total_category_name: "Все категории"

# ---- Фильтрация рядов перед прогнозированием -------------------------------
filtering:
  # Минимальное число месяцев с данными, чтобы ряд (МО x категория) попал
  # в обучение/оценку. При 24 месяцах истории берём ряды без пропусков.
  min_months_per_series: 24

# ---- Как интерпретировать дату --------------------------------------------
date_format: "%Y-%m"           # формат строки даты в файле
