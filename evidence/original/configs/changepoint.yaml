# ===========================================================================
# Конфигурация обнаружения точек структурных изменений (changepoint detection).
# ===========================================================================

# ---- Какие методы сравниваем -----------------------------------------------
methods:
  ruptures_pelt: true      # PELT (Pruned Exact Linear Time)
  ruptures_binseg: true    # Binary Segmentation
  ruptures_window: true    # Window-based детектор
  cusum: true              # CUSUM (накопленные суммы отклонений)
  bocpd: true              # Bayesian Online Changepoint Detection

# ---- Параметры ruptures ----------------------------------------------------
ruptures_params:
  # Функция стоимости: "l2" ловит сдвиг среднего, "rbf" — более общие сдвиги.
  model_cost: "rbf"
  # Штраф за каждую дополнительную точку разладки (чем больше, тем меньше
  # точек находим). Используется в PELT.
  penalty: 3.0
  # Минимальное расстояние между соседними точками разладки (в месяцах).
  min_size: 3
  # Для Window-детектора — ширина окна.
  window_width: 4

# ---- Параметры CUSUM -------------------------------------------------------
cusum_params:
  # Порог срабатывания (в единицах стандартного отклонения приращений).
  # Значение 2.0 подобрано по синтетике: даёт лучший баланс
  # точности и полноты (F1 около 0.81), см. методологический отчёт.
  threshold_sigma: 2.0
  # "Мёртвая зона" (drift): малые отклонения внутри неё не накапливаются.
  drift_sigma: 0.25

# ---- Параметры BOCPD -------------------------------------------------------
bocpd_params:
  # Ожидаемая средняя длина отрезка стабильности (в месяцах).
  # Через неё задаётся hazard-функция = 1 / expected_run_length.
  # Значение 6 подобрано по синтетике (лучший F1 при малой задержке детекции).
  expected_run_length: 6
  # Параметры нормально-гамма сопряжённого априори (студентовское
  # предиктивное распределение). Значения по умолчанию — слабое априори.
  mu0: 0.0
  kappa0: 1.0
  alpha0: 1.0
  beta0: 1.0
  # Порог вероятности разладки для объявления точки изменения.
  probability_threshold: 0.5

# ---- Предобработка ряда перед поиском разладок -----------------------------
preprocessing:
  # Убирать ли сезонность (сезонная разность 12 мес) перед поиском разладок.
  # Для месячных рядов с сильным декабрьским пиком это важно, иначе детектор
  # будет путать сезонный пик со структурным сдвигом.
  deseasonalize: true
  # Стандартизировать ли ряд (вычесть среднее, поделить на СКО).
  standardize: true

# ---- Оценка качества детекторов на синтетике -------------------------------
evaluation:
  # Допуск по времени (в точках): детекция засчитывается, если найденная
  # точка в пределах tolerance от истинной.
  tolerance: 2
  # Параметры генерации синтетических рядов с известными точками разладки.
  synthetic:
    n_series: 200          # сколько рядов сгенерировать
    series_length: 48      # длина каждого ряда (точек)
    n_changepoints: 2      # сколько истинных точек разладки вставлять
    noise_sigma: 1.0       # уровень шума
    random_seed: 7

# ---- Онлайн-детектор шоков по остаткам прогноза ----------------------------
online_shock_detector:
  # Окно для нормировки остатков (в месяцах).
  calibration_window: 12
  # Порог в сигмах для флага "ранний сигнал шока".
  alert_sigma: 3.0
