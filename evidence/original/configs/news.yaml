# ===========================================================================
# Конфигурация интеграции новостей и внешних датированных событий.
# ===========================================================================

paths:
  # Таблица датированных событий (составляется на основе открытых источников).
  events_file: "data/external/events_calendar.csv"
  # Готовый месячный новостной признак по регионам (строится скриптом).
  news_features_file: "data/external/news_features.csv"

# ---- Как согласовывать новости с данными СберИндекса -----------------------
alignment:
  # Частота агрегации новостей = частота данных расходов (месяц).
  frequency: "M"

  # Лаг влияния новости на расходы (в месяцах):
  #   0 — эффект в том же месяце,
  #   1 — эффект со сдвигом на следующий месяц.
  # Для прогноза используем только новости, доступные НА момент отсечки
  # (origin), чтобы не было заглядывания в будущее (look-ahead).
  effect_lag_months: 0

  # Пространственная привязка:
  #   "federal"  — событие влияет на все МО страны,
  #   "regional" — событие привязано к конкретному region_code.
  # Поле scope в таблице событий определяет уровень.
  default_scope: "federal"

# ---- Как превращать события в числовой признак -----------------------------
signal:
  # Тип агрегируемого сигнала:
  #   "intensity" — суммарная "сила" событий за месяц,
  #   "sentiment" — тональность (положительная/отрицательная),
  #   "count"     — просто число событий.
  signal_type: "intensity"
  # Сглаживание сигнала (экспоненциальное) для устойчивости.
  ewm_halflife_months: 1.0
