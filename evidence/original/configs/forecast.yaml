# ===========================================================================
# Конфигурация прогнозирования и бэктеста.
# ===========================================================================

# ---- Горизонты прогнозирования (в месяцах), как требует ТЗ -----------------
horizons:
  - 1
  - 3
  - 6
  - 12

# ---- Схема бэктеста (rolling-origin / скользящее начало) -------------------
backtest:
  # Минимальная длина обучающей выборки (в месяцах) перед первым прогнозом.
  # При истории всего 24 месяца значение 6 позволяет:
  #   - дать глобальной модели достаточно точек отсчёта (origins) для обучения,
  #   - протестировать даже горизонт 12 месяцев (нужна отсечка не позже 12-го
  #     месяца, а модель к этому моменту уже должна быть обучена).
  # Лаги на 12 месяцев при короткой истории становятся пропусками (NaN),
  # LightGBM корректно их обрабатывает.
  min_train_months: 6

  # Шаг между точками отсчёта (origin). 1 = проверяем каждый месяц.
  origin_step: 1

  # Сколько территорий брать в "турнир моделей" (сравнение всех моделей на
  # одинаковом наборе рядов). Полную панель (все ~2190 МО) прогоняет только
  # лучшая модель — это экономит время на медленном Prophet.
  # null -> брать все территории (медленно). Число -> случайная
  # стратифицированная выборка территорий.
  tournament_territories: 120

  # Зерно генератора случайных чисел для воспроизводимости выборки.
  random_seed: 42

# ---- Какие модели участвуют в сравнении ------------------------------------
models:
  seasonal_naive: true     # нижняя планка: значение 12 месяцев назад
  prophet: true            # базовая модель из ТЗ (её нужно превзойти)
  ets: true                # экспоненциальное сглаживание Холта-Уинтерса
  lightgbm_global: true    # глобальная панельная модель (главный кандидат)
  chronos: false           # фундаментальная модель (нужны веса HuggingFace)

# ---- Гиперпараметры Prophet (базовая модель) -------------------------------
prophet_params:
  weekly_seasonality: false
  daily_seasonality: false
  seasonality_mode: "additive"
  # Отключаем доверительные интервалы для скорости бэктеста.
  uncertainty_samples: 0
  # Число гармоник Фурье для годовой сезонности. Для месячных данных 3
  # гармоники достаточно; дефолтные 10 переобучают короткий ряд и резко
  # замедляют обучение. См. комментарий в models_forecast.forecast_prophet.
  yearly_fourier_order: 3
  # Число точек изменения тренда (мало — чтобы не переобучаться на 24 месяцах).
  n_changepoints: 5

# ---- Гиперпараметры ETS (Holt-Winters) ------------------------------------
ets_params:
  trend: "add"             # аддитивный тренд
  seasonal: "add"          # аддитивная сезонность
  seasonal_periods: 12     # годовая сезонность для месячных данных
  # Если ряд слишком короткий для сезонной модели, код автоматически
  # переключается на модель без сезонности (см. models_forecast.py).

# ---- Гиперпараметры глобальной модели LightGBM -----------------------------
lightgbm_params:
  objective: "regression_l1"   # оптимизируем MAE напрямую (L1)
  n_estimators: 400
  learning_rate: 0.05
  num_leaves: 63
  min_child_samples: 40
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0
  n_jobs: -1
  verbose: -1

# ---- Гиперпараметры фундаментальной модели Chronos (zero-shot) -------------
chronos_params:
  # Имя модели на HuggingFace. Можно выбрать размер: tiny/mini/small/base/large.
  model_name: "amazon/chronos-t5-small"
  # Имя локальной папки с весами внутри models_cache (если веса скачаны заранее).
  # Пусто -> грузить с HuggingFace (нужен интернет).
  local_folder: ""
  # Устройство: cpu или cuda.
  device: "cpu"
  # Сколько выборок генерировать для оценки медианы прогноза.
  num_samples: 20
  # На скольких территориях гонять Chronos в турнире (модель медленная на CPU).
  # Берётся подвыборка из общей турнирной выборки.
  tournament_territories: 40

# ---- Признаки для глобальной модели ---------------------------------------
features:
  # Какие лаги целевой переменной использовать (в месяцах).
  lags:
    - 1
    - 2
    - 3
    - 6
    - 12
  # Окна для скользящего среднего (в месяцах).
  rolling_means:
    - 3
    - 6
    - 12
  # Использовать ли месячные индикаторы (сезонность через one-hot месяца).
  use_month_dummies: true
  # Использовать ли статические признаки территории.
  use_market_access: true
  use_region: true
  use_coordinates: true
  # Использовать ли признаки праздников (число нерабочих дней в месяце).
  use_holiday_features: true
  # Использовать ли новостной признак (если файл подготовлен).
  use_news_features: false

# ---- Трансформация целевой переменной --------------------------------------
target:
  # Логарифмировать ли расходы перед обучением (log1p). Помогает при
  # большом разбросе значений между крупными и малыми МО.
  use_log1p: true

# ---- Куда сохранять результаты ---------------------------------------------
output:
  metrics_dir: "outputs/metrics"
  forecasts_dir: "outputs/forecasts"
  figures_dir: "outputs/figures"
