# ===========================================================================
# ПРЕД-РЕГИСТРАЦИЯ целевого события «устойчивый сдвиг уровня» (scripts/19).
#
# Отдельное, ЯВНО заданное целевое изменение (в отличие от импульс-возврата
# месячной разметки scripts/15). Проверяется на синтетике: постоянный скачок
# уровня размечается, одноразовый всплеск с возвратом — нет (тесты
# LevelShiftTests). Версия повышается при любом изменении определения.
#
# Оговорка: конфиг делает постановку явной и версионируемой, но сам по себе НЕ
# доказывает независимую предрегистрацию до знакомства с тестом.
# ===========================================================================

version: 1
formulation_id: "level_shift_w6_p2_k3_h3_v1"

# --- Определение целевого события (устойчивый сдвиг уровня) ------------------
target_definition:
  window: 6            # W: прошлое окно для базового уровня (мес)
  persistence: 2       # P: сдвиг держится P месяцев подряд в одну сторону
  threshold_k: 3.0     # порог отклонения уровня (в единицах масштаба)
  horizon: 3           # горизонт предупреждения (мес)
  # ПОПРАВКА АУДИТА v9: масштаб (scale_floor) — параметр определения события,
  # он НЕ должен зависеть от тестового будущего. Оцениваем его ТОЛЬКО по данным
  # строго до тестового периода. Reference period обоснован: полный календарный
  # 2023 год (12 месяцев), который заканчивается ДО первого тестового origin
  # (2024-02) и до самого раннего тестового окна onset (март 2024).
  scale_reference_cutoff: "2023-12"
  # Зафиксированный причинным алгоритмом результат (для прозрачности; пересчитывается
  # скриптом из reference period, не подставляется вручную): scale_floor ≈ 0.06879.

# --- Протокол сравнения (как в scripts/15) ----------------------------------
protocol:
  kind: "rolling-origin"
  growing_train: true
  test_origins:
  - "2024-02"
  - "2024-05"
  - "2024-08"
  - "2024-11"         # НЕзрелый на данных до 2024-12: оценивается как pending

# --- Бюджет тревог (как в scripts/15) ---------------------------------------
alarm_budget:
  policy: "top_k_per_release"
  target_alarm_rate: 0.10
  tie_break: "territory_id"

# --- Признаки (каузальные, те же, что в scripts/15) -------------------------
feature_columns:
- z
- r
- trailing_vol
- rate_change
- cpi_signal
