# ===========================================================================
# ПРЕД-РЕГИСТРАЦИЯ эксперимента раннего предупреждения (scripts/15).
#
# Этот файл фиксирует определение шока, протокол и бюджет тревог ДО сравнения
# методов, чтобы изменения постановки были воспроизводимы и не смешивались с
# прежними результатами. Версия повышается при любом изменении определения.
#
# ВАЖНО (честная оговорка): наличие этого файла и констант в коде само по себе
# НЕ является доказательством независимой предварительной регистрации. Это лишь
# делает выбранную постановку явной, версионируемой и отделённой от старой
# risk-постановки (scripts/13), метрики которой НЕсопоставимы напрямую.
# ===========================================================================

version: 1
formulation_id: "mom_window6_k3_dur2_h3_v1"

# --- Определение шока (месячная лог-разность + короткое скользящее окно) -----
shock_definition:
  window: 6            # прогрев скользящего окна (мес)
  horizon: 3           # горизонт предупреждения (мес)
  min_duration: 2      # подтверждение шока (мес подряд экстремальных)
  threshold_k: 3.0     # порог экстремальности |z| (в единицах робастного масштаба)

# --- Протокол сравнения ------------------------------------------------------
protocol:
  kind: "rolling-origin"            # обучение на прошлом -> тест на следующем интервале
  growing_train: true               # растущее обучающее окно
  # Непересекающиеся окна событий; КАЖДЫЙ origin проверяется только если его
  # метка полностью наблюдается (origin + horizon + min_duration-1 <= last_month).
  test_origins:
  - "2024-02"
  - "2024-05"
  - "2024-08"
  - "2024-11"         # НЕзрелый на данных до 2024-12: оценивается как pending

# --- Бюджет тревог -----------------------------------------------------------
alarm_budget:
  # top-K на каждом текущем выпуске: предупреждаем фиксированную долю самых
  # рискованных МО месяца. Это сравнение РАНЖИРОВАНИЯ при равной нагрузке, а НЕ
  # замороженный абсолютный порог с ранней валидации. Совпадения оценок
  # разрешаются детерминированно по territory_id (ровно K тревог).
  policy: "top_k_per_release"
  target_alarm_rate: 0.10
  tie_break: "territory_id"

# --- Признаки для обучаемой модели -------------------------------------------
feature_columns:
- z
- r
- trailing_vol
- rate_change
- cpi_signal
