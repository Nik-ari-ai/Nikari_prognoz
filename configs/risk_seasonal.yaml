# ===========================================================================
# ПРЕД-РЕГИСТРАЦИЯ прикладного целевого события «сезонно-нормализованный шок»
# (scripts/20). Отдельное, ЯВНО заданное событие: необычное отклонение МО от
# собственного уровня И общего движения всех МО. Декабрьские календарные пики
# исключаются сезонной/общей нормализацией. Версия повышается при изменении.
#
# Оговорка: конфиг делает постановку явной и версионируемой, но сам по себе НЕ
# доказывает независимую предрегистрацию до знакомства с тестом.
# ===========================================================================

version: 1
formulation_id: "seasonal_shock_ref2023_q95_q99_p2_h1_v1"

# --- Определение целевого события -------------------------------------------
target_definition:
  # Масштаб и квантильные пороги оцениваются ТОЛЬКО по reference period строго
  # до тестового периода (каузально, поправка духа аудита v9).
  scale_reference_cutoff: "2023-12"
  persistence: 2          # серия >= P месяцев превышения q_persist
  persist_quantile: 0.95  # нижний порог (для персистентного триггера)
  single_quantile: 0.99   # верхний порог (одномоментный триггер)
  horizon: 1              # горизонт предупреждения (мес); h=1 даёт непересекающиеся фолды

# --- Протокол: много непересекающихся rolling-фолдов + финальный holdout ----
protocol:
  kind: "rolling-origin"
  growing_train: true
  # Горизонт 1 => каждый origin предсказывает СВОЙ отдельный месяц (без перекрытия).
  test_origins:
  - "2024-02"
  - "2024-03"
  - "2024-04"
  - "2024-05"
  - "2024-06"
  - "2024-07"
  - "2024-08"
  - "2024-09"
  # Финальный holdout — отдельно, не смешивается с rolling-агрегатом.
  holdout_origin: "2024-10"

# --- Бюджет тревог ----------------------------------------------------------
alarm_budget:
  policy: "top_k_per_release"
  target_alarm_rate: 0.10
  tie_break: "territory_id"

# --- Кластерный бутстрэп (по territory_id) для доверительных интервалов ----------------------------------
bootstrap:
  samples: 1000
  seed: 2026
  confidence: 0.95

# --- Признаки модели (каузальные) -------------------------------------------
feature_columns:
- z
- r
- trailing_z_vol
- common_movement
- rate_change
- cpi_signal
